[package]
name = "wasm-hello"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Leptos component compiled to WebAssembly and driven from the Next.js app"

[lib]
# cdylib -> the .wasm artifact wasm-pack emits; rlib -> so `cargo test` can link it.
crate-type = ["cdylib", "rlib"]

[dependencies]
leptos = { version = "0.8", features = ["csr"] }
wasm-bindgen = "0.2"
console_error_panic_hook = "0.1"

[dependencies.web-sys]
version = "0.3"
features = ["Document", "Element", "HtmlElement", "Window"]

# The wasm-opt bundled with wasm-pack predates the WASM features that recent
# rustc emits by default, so they have to be enabled explicitly or validation
# fails. Set `wasm-opt = false` to skip the optimiser entirely.
[package.metadata.wasm-pack.profile.release]
wasm-opt = [
  "-Oz",
  "--enable-bulk-memory",
  "--enable-nontrapping-float-to-int",
  "--enable-sign-ext",
  "--enable-mutable-globals",
  "--enable-reference-types",
]

[package.metadata.wasm-pack.profile.dev]
wasm-opt = false
