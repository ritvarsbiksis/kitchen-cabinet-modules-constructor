[package]
name = "wasm-viewer"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "glTF viewer rendered with wgpu (WebGPU/WebGL2) and compiled to WebAssembly"

[lib]
# cdylib -> the .wasm artifact wasm-pack emits; rlib -> so `cargo test` can link it.
crate-type = ["cdylib", "rlib"]

[dependencies]
# Model loading and maths are target independent, so they stay unit-testable with
# a plain `cargo test` on the host. Everything that touches the GPU or the DOM is
# behind `cfg(target_arch = "wasm32")` below.
bytemuck = { version = "1", features = ["derive"] }
glam = "0.30"
gltf = { version = "1.4", default-features = false, features = [
  "utils",
  "names",
  "extensions",
  "KHR_materials_transmission",
] }
image = { version = "0.25", default-features = false, features = ["png"] }
wasm-bindgen = "0.2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1"
js-sys = "0.3"
wasm-bindgen-futures = "0.4"
# Native backends are pointless here and only slow the build down, so the default
# features are off: `webgpu` is the primary backend and `webgl` the fallback for
# browsers that do not expose WebGPU yet.
wgpu = { version = "30", default-features = false, features = [
  "std",
  "wgsl",
  "webgpu",
  "webgl",
] }

[target.'cfg(target_arch = "wasm32")'.dependencies.web-sys]
version = "0.3"
features = [
  "AddEventListenerOptions",
  "console",
  "Document",
  "DomRect",
  "Element",
  "Event",
  "EventTarget",
  "HtmlCanvasElement",
  "HtmlElement",
  "PointerEvent",
  "ResizeObserver",
  "ResizeObserverEntry",
  "WheelEvent",
  "Window",
]

# The wasm-opt bundled with wasm-pack predates the WASM features that recent
# rustc emits by default, so they have to be enabled explicitly or validation
# fails. Set `wasm-opt = false` to skip the optimiser entirely.
[package.metadata.wasm-pack.profile.release]
wasm-opt = [
  "-Oz",
  "--enable-bulk-memory",
  "--enable-nontrapping-float-to-int",
  "--enable-sign-ext",
  "--enable-mutable-globals",
  "--enable-reference-types",
]

[package.metadata.wasm-pack.profile.dev]
wasm-opt = false
