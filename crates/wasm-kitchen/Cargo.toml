[package]
name = "wasm-kitchen"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Interactive kitchen constructor rendered with wgpu (WebGPU/WebGL2) and compiled to WebAssembly"

[lib]
# cdylib -> the .wasm artifact wasm-pack emits; rlib -> so `cargo test` can link it.
crate-type = ["cdylib", "rlib"]

[dependencies]
# The room layout, the camera, picking and the procedural meshes and floor
# texture are target independent, so they are unit tested with a plain
# `cargo test` on the host. Everything that touches the GPU or the DOM is behind
# `cfg(target_arch = "wasm32")` below.
bytemuck = { version = "1", features = ["derive"] }
glam = "0.30"
scene-assets = { path = "../scene-assets" }
wasm-bindgen = "0.2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1"
js-sys = "0.3"
wasm-bindgen-futures = "0.4"
# Same backends as `wasm-viewer`: WebGPU first, WebGL2 as the fallback.
wgpu = { version = "30", default-features = false, features = [
  "std",
  "wgsl",
  "webgpu",
  "webgl",
] }

[target.'cfg(target_arch = "wasm32")'.dependencies.web-sys]
version = "0.3"
features = [
  "AddEventListenerOptions",
  "console",
  "CssStyleDeclaration",
  "DomRect",
  "Element",
  "Event",
  "EventTarget",
  "HtmlCanvasElement",
  "HtmlElement",
  "PointerEvent",
  "ResizeObserver",
  "ResizeObserverEntry",
  "WheelEvent",
  "Window",
]

# The wasm-opt bundled with wasm-pack predates the WASM features that recent
# rustc emits by default, so they have to be enabled explicitly or validation
# fails. Set `wasm-opt = false` to skip the optimiser entirely.
[package.metadata.wasm-pack.profile.release]
wasm-opt = [
  "-Oz",
  "--enable-bulk-memory",
  "--enable-nontrapping-float-to-int",
  "--enable-sign-ext",
  "--enable-mutable-globals",
  "--enable-reference-types",
]

[package.metadata.wasm-pack.profile.dev]
wasm-opt = false
